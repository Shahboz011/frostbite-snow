[package]
name = "frostbite-platform"
version = "0.1.0"
edition = "2021"
description = "OS integration layer for Frostbite (Windows today, macOS later)."
publish = false

[dependencies]
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

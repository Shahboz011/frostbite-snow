name: Windows build

on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed to publish the build as a GitHub Release (downloadable without sign-in).
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install JS dependencies
        run: npm ci

      - name: Type-check frontend
        run: npm run typecheck

      - name: Rust tests
        run: cargo test -p frostbite -p frostbite-platform

      - name: Build NSIS installer
        run: npm run build:nsis

      - name: Build MSIX (signed with a throwaway test certificate)
        shell: pwsh
        run: |
          $pw = ConvertTo-SecureString "frostbite-ci-test" -AsPlainText -Force
          ./packaging/msix/new-test-cert.ps1 -Password $pw -OutFile ci-test.pfx -CerFile target/release/bundle/msix-test-cert.cer
          ./packaging/msix/build-msix.ps1 -SkipBuild -CertificatePath ci-test.pfx -CertificatePassword $pw

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Frostbite-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload MSIX
        uses: actions/upload-artifact@v4
        with:
          name: Frostbite-msix-test
          path: |
            target/release/bundle/msix/*.msix
            target/release/bundle/msix-test-cert.cer
          if-no-files-found: error

      # Releases (unlike Actions artifacts) can be downloaded without a GitHub
      # account: https://github.com/<owner>/<repo>/releases/latest
      - name: Publish test build as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build-${{ github.run_number }}
          name: Test build ${{ github.run_number }}
          make_latest: true
          body: |
            Automatic test build from commit ${{ github.sha }}.

            **Install:** download `Frostbite_..._x64-setup.exe` below and run it.
            It isn't code-signed yet, so Windows SmartScreen will warn:
            click **More info → Run anyway**.

            Settings and Quit are on the snowflake tray icon (bottom-right,
            maybe under the ^ arrow).

            The `.msix` + `.cer` are for testing the Microsoft Store package
            (needs an admin step to trust the test certificate; see
            docs/PUBLISHING.md).
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msix/*.msix
            target/release/bundle/msix-test-cert.cer
          fail_on_unmatched_files: true

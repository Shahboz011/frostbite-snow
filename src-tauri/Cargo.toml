[package]
name = "frostbite"
version = "0.1.0"
description = "Snow falls on your desktop."
edition = "2021"
publish = false

[lib]
name = "frostbite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
raw-window-handle = "0.6"
frostbite-platform = { path = "../crates/frostbite-platform" }

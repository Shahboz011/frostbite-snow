<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bulldozer Preview</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1b3a5c; }
      canvas { display: block; width: 100vw; height: 100vh; }
      #ui { position: fixed; top: 10px; left: 10px; display: flex; gap: 6px; font: 13px system-ui; }
      #ui button { padding: 6px 10px; border: 0; border-radius: 6px; background: #fff; cursor: pointer; }
      #ui button.on { background: #f2c14e; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="ui">
      <button id="plow" class="on">Plowing</button>
      <button id="close">Close-up</button>
    </div>
    <script type="module" src="/src/dozerPreview.ts"></script>
  </body>
</html>

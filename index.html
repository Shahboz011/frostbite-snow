<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frostbite</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
        -webkit-user-select: none;
      }
      #snow {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        display: block;
      }
      #debug {
        position: fixed;
        top: 8px;
        left: 8px;
        font: 12px/1.4 ui-monospace, Consolas, monospace;
        color: #fff;
        background: rgba(0, 0, 0, 0.55);
        padding: 4px 8px;
        border-radius: 4px;
        pointer-events: none;
        white-space: pre;
        display: none;
      }
      /* Browser dev preview only: something to see white snow against. */
      body.preview {
        background:
          linear-gradient(180deg, #24324a 0%, #3b4f6e 55%, #6b7f99 100%);
      }
      .mon-outline {
        position: fixed;
        border: 1px dashed rgba(255, 255, 255, 0.35);
        pointer-events: none;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <canvas id="snow"></canvas>
    <div id="debug"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
